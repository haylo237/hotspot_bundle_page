<!--
================================================================================
  HAYLO INTERNET — Standalone Printable Receipt (receipt.html)
================================================================================
  Purpose:
    - A clean, print-friendly receipt page that reads its data from query
      parameters and renders a professional receipt.
    - Use this if you want a separate receipt link instead of (or in addition
      to) the in-page receipt generator in success.html.

  Expected URL:
    receipt.html?username=user123
                &password=pass123
                &bundle=1day
                &bundle_name=1%20Day%20Pass
                &amount=500
                &duration=24h
                &speed=5Mbps
                &reference=CP12345
                &receipt=RCPT001
                &mac=AA:BB:CC:DD:EE:FF
                &ip=10.5.50.23
                &date=2026-05-20%2014:30

  Notes:
    - Pure HTML/CSS/JS, no dependencies.
    - "Print" uses window.print(). "Download" saves the receipt as an HTML file.

  >>>>> CHANGE: ISP_NAME, SUPPORT_PHONE, SUPPORT_EMAIL below as needed. <<<<<
================================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Receipt — HAYLO INTERNET</title>
    <style>
        *,*::before,*::after { box-sizing: border-box; margin:0; padding:0; }
        html,body { height: 100%; background: #eef1f6; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #1a1f2e;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .toolbar {
            max-width: 560px; margin: 0 auto 14px;
            display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap;
        }
        .toolbar .btn {
            padding: 10px 14px; border-radius: 10px; border: none; cursor: pointer;
            font-size: 13px; font-weight: 600;
            transition: filter .15s ease, transform .15s ease;
        }
        .btn-primary { background: #111827; color: #fff; }
        .btn-ghost { background: #fff; color: #1a1f2e; border: 1px solid #d6dbe4; }
        .btn:hover { filter: brightness(1.05); }
        .btn:active { transform: translateY(1px); }

        .receipt {
            max-width: 560px;
            margin: 0 auto;
            background: #fff;
            border-radius: 14px;
            border: 1px solid #e2e6ee;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
            padding: 28px 26px;
        }

        .head {
            display: flex; align-items: center; justify-content: space-between;
            gap: 14px;
            padding-bottom: 16px;
            border-bottom: 1px dashed #d6dbe4;
        }
        .brandbox { display: flex; align-items: center; gap: 12px; }
        .logo-mark {
            width: 44px; height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #4f8cff, #b14bff);
            display: grid; place-items: center;
            color: #fff;
        }
        .logo-mark svg { width: 24px; height: 24px; }
        .brand-name { font-weight: 800; font-size: 16px; letter-spacing: .4px; }
        .brand-sub { font-size: 11px; color: #6b7382; }

        .meta { text-align: right; }
        .meta .lbl { font-size: 10px; color: #6b7382; text-transform: uppercase; letter-spacing: .6px; }
        .meta .val { font-size: 13px; font-weight: 700; color: #111827; }

        .title {
            margin-top: 18px;
            font-size: 13px;
            font-weight: 700;
            color: #6b7382;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }
        .title strong { display:block; color: #111827; font-size: 18px; letter-spacing: 0; margin-top: 4px; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 14px;
            font-size: 13px;
        }
        td {
            padding: 9px 6px;
            border-bottom: 1px dashed #e2e6ee;
            vertical-align: top;
        }
        td.k { color: #6b7382; width: 42%; }
        td.v { color: #111827; font-weight: 600; text-align: right; word-break: break-all; }

        .amount-row td { border-top: 1px solid #111827; border-bottom: none; padding-top: 12px; }
        .amount-row td.k { color: #111827; font-weight: 700; }
        .amount-row td.v { font-size: 16px; color: #111827; }

        .creds {
            margin-top: 14px;
            padding: 12px 14px;
            background: #f5f7fc;
            border: 1px dashed #c8cfdc;
            border-radius: 10px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        @media (max-width: 420px) { .creds { grid-template-columns: 1fr; } }
        .cred .lbl { font-size: 10px; color: #6b7382; text-transform: uppercase; letter-spacing: .6px; }
        .cred .val { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; font-size: 15px; color: #111827; }

        .footer {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px dashed #d6dbe4;
            font-size: 11px;
            color: #6b7382;
            text-align: center;
            line-height: 1.6;
        }
        .footer .thanks {
            margin-top: 6px;
            font-size: 12px;
            color: #111827;
            font-weight: 700;
        }

        /* Print styles */
        @media print {
            body { background: #fff; padding: 0; }
            .toolbar { display: none; }
            .receipt { box-shadow: none; border: none; border-radius: 0; }
        }
    </style>
</head>
<body>

<div class="toolbar">
    <button class="btn btn-ghost" type="button" onclick="downloadReceipt()">Download</button>
    <button class="btn btn-primary" type="button" onclick="window.print()">Print Receipt</button>
</div>

<div class="receipt" id="receiptRoot">
    <div class="head">
        <div class="brandbox">
            <div class="logo-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12.55a11 11 0 0 1 14 0"/>
                    <path d="M1.5 9a16 16 0 0 1 21 0"/>
                    <path d="M8.5 16.05a6 6 0 0 1 7 0"/>
                    <circle cx="12" cy="20" r="1.2" fill="currentColor"/>
                </svg>
            </div>
            <div>
                <div class="brand-name" id="brandName">HAYLO INTERNET</div>
                <div class="brand-sub">High-Speed Public WiFi</div>
            </div>
        </div>
        <div class="meta">
            <div class="lbl">Receipt No.</div>
            <div class="val" id="rReceipt">—</div>
        </div>
    </div>

    <div class="title">Internet Access<strong>Receipt</strong></div>

    <table>
        <tr><td class="k">Transaction Ref.</td><td class="v" id="rReference">—</td></tr>
        <tr><td class="k">Date / Time</td><td class="v" id="rDate">—</td></tr>
        <tr><td class="k">Client IP</td><td class="v" id="rIp">—</td></tr>
        <tr><td class="k">Client MAC</td><td class="v" id="rMac">—</td></tr>
        <tr><td class="k">Bundle</td><td class="v" id="rBundle">—</td></tr>
        <tr><td class="k">Duration</td><td class="v" id="rDuration">—</td></tr>
        <tr><td class="k">Speed</td><td class="v" id="rSpeed">—</td></tr>
        <tr class="amount-row"><td class="k">Amount Paid</td><td class="v" id="rAmount">—</td></tr>
    </table>

    <div class="creds">
        <div class="cred">
            <div class="lbl">Username</div>
            <div class="val" id="rUser">—</div>
        </div>
        <div class="cred">
            <div class="lbl">Password</div>
            <div class="val" id="rPass">—</div>
        </div>
    </div>

    <div class="footer">
        <!-- >>>>> CHANGE SUPPORT_PHONE / SUPPORT_EMAIL here <<<<< -->
        Support: <span id="rSupportPhone">+237 6XX XXX XXX</span> ·
        <span id="rSupportEmail">support@haylo.example</span>
        <div class="thanks">Thank you for choosing <span id="rBrand2">HAYLO INTERNET</span>!</div>
    </div>
</div>

<script>
    /* ----------------------------------------------------------------
       Configuration placeholders
       >>>>> CHANGE THESE for your deployment <<<<<
       ---------------------------------------------------------------- */
    var ISP_NAME      = "HAYLO INTERNET";
    var SUPPORT_PHONE = "+237 6XX XXX XXX";
    var SUPPORT_EMAIL = "support@haylo.example";

    /* Parse query parameters */
    function getParams() {
        var out = {};
        var qs = window.location.search.substring(1);
        if (!qs) return out;
        qs.split("&").forEach(function (pair) {
            if (!pair) return;
            var kv = pair.split("=");
            out[decodeURIComponent(kv[0] || "")] = decodeURIComponent((kv[1] || "").replace(/\+/g, " "));
        });
        return out;
    }
    var P = getParams();

    function setText(id, val) {
        var el = document.getElementById(id);
        if (el) el.textContent = (val == null || val === "") ? "—" : val;
    }
    function nowStr() {
        function pad(n){ return n < 10 ? "0"+n : ""+n; }
        var d = new Date();
        return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate())
             + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
    }

    /* Populate from query string */
    setText("brandName",    ISP_NAME);
    setText("rBrand2",      ISP_NAME);
    setText("rSupportPhone", SUPPORT_PHONE);
    setText("rSupportEmail", SUPPORT_EMAIL);

    setText("rReceipt",   P.receipt);
    setText("rReference", P.reference);
    setText("rDate",      P.date || nowStr());
    setText("rIp",        P.ip);
    setText("rMac",       P.mac);
    setText("rBundle",    P.bundle_name || P.bundle);
    setText("rDuration",  P.duration);
    setText("rSpeed",     P.speed);
    setText("rAmount",    P.amount ? (P.amount + " XAF") : "—");
    setText("rUser",      P.username);
    setText("rPass",      P.password);

    /* ----------------------------------------------------------------
       Download the rendered receipt as a standalone HTML file.
       (Captures the current DOM so the saved file is self-contained.)
       ---------------------------------------------------------------- */
    function downloadReceipt() {
        var styles = "";
        // Inline the page's <style> blocks so the downloaded file looks identical.
        document.querySelectorAll("style").forEach(function (s) { styles += s.outerHTML; });
        var html = "<!DOCTYPE html><html><head><meta charset='UTF-8'>"
                 + "<title>Receipt — " + ISP_NAME + "</title>"
                 + styles + "</head><body>"
                 + document.getElementById("receiptRoot").outerHTML
                 + "</body></html>";
        var blob = new Blob([html], { type: "text/html;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        var name = "receipt-" + (P.receipt || P.reference || Date.now()) + ".html";
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click();
        setTimeout(function () {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }, 100);
    }
</script>
</body>
</html>
